<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>다문화 수행평가 관리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/teacher.css">
  <link rel="stylesheet" href="css/poster.css">
</head>
<body class="teacher">

  <!-- ===== 교사 로그인 ===== -->
  <section id="tLoginView" class="t-login">
    <div class="t-login-card">
      <h1>다문화 수행평가 관리</h1>
      <label class="field"><span>교사 비밀번호</span><input id="tPw" type="password" autocomplete="off"></label>
      <button id="tLoginBtn" class="btn-primary">들어가기</button>
      <p id="tLoginSlow" class="slow-hint" role="status" hidden></p>
      <p id="tLoginMsg" class="t-msg" role="alert"></p>
    </div>
  </section>

  <!-- ===== 대시보드 ===== -->
  <section id="dashView" hidden>
    <header class="t-top">
      <h1>다문화 수행평가 관리</h1>
      <div class="t-top-btns">
        <button id="refreshBtn">새로고침</button>
        <button id="tLogoutBtn" class="btn-quiet">나가기</button>
      </div>
    </header>
    <nav id="classTabs" class="tabs" role="tablist"></nav>
    <main id="classPanel" class="class-panel"></main>
  </section>

  <!-- ===== 포스터 보기 ===== -->
  <div id="previewOverlay" class="overlay" hidden>
    <div class="overlay-inner">
      <div class="overlay-head">
        <b id="tPreviewTitle"></b>
        <div class="overlay-btns">
          <button id="tPreviewPrint" class="btn-primary">인쇄</button>
          <button id="previewClose">닫기</button>
        </div>
      </div>
      <div id="previewBox" class="poster-fit"></div>
    </div>
  </div>

  <div id="printArea"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/poster.js"></script>
  <script src="js/teacher.js"></script>
</body>
</html>
